[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "single-tron2-chip"
version = "0.1.0"
description = "Single-WFYG_TRON2A CHIP hindsight-perturbation research scaffold"
requires-python = ">=3.10"
dependencies = ["mujoco>=3.2.3,<3.3", "numpy>=1.23,<2"]

[project.optional-dependencies]
test = ["pytest>=7", "matplotlib>=3.7"]
train = ["gymnasium>=0.29", "torch>=2.1", "onnx>=1.15", "PyYAML>=6"]
plot = ["matplotlib>=3.7"]
deployment = ["onnxruntime>=1.17"]

[project.scripts]
tron2-chip-build = "tron2_chip.build_scene:main"
tron2-chip-sanity = "tron2_chip.run_sanity:main"
tron2-chip-plot = "tron2_chip.plot_csv:main"
tron2-chip-deploy = "tron2_chip.run_deployment:main"
tron2-chip-sweep = "tron2_chip.evaluation.compliance_sweep:main"
tron2-intent-train = "tron2_chip.intent_estimation.train:main"
tron2-intent-prepare-ocs2 = "tron2_chip.intent_estimation.prepare_ocs2:main"
tron2-intent-export = "tron2_chip.intent_estimation.export_model:main"
tron2-wrench-audit = "tron2_chip.external_wrench_estimation.audit:main"
tron2-wrench-train = "tron2_chip.external_wrench_estimation.train:main"
tron2-wrench-export = "tron2_chip.external_wrench_estimation.export:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
