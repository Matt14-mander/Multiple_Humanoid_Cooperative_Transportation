[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dual-tron1-mujoco"
version = "0.1.0"
description = "Windows-native MuJoCo simulation for two TRON1 robots carrying one payload"
requires-python = ">=3.8"
dependencies = [
  "mujoco>=3.2.3,<3.3",
  "numpy>=1.23,<1.26.4",
]

[project.optional-dependencies]
policy = ["onnxruntime>=1.16,<2"]
ifsm = ["pin>=3.2,<4.1"]
test = ["pytest>=7,<9"]

[project.scripts]
dual-tron1-build = "dual_tron1_mujoco.build_scene:main"
dual-tron1-sim = "dual_tron1_mujoco.run_sim:main"
dual-tron1-inspect-onnx = "dual_tron1_mujoco.onnx_policy:main"
airbot-observer-validate = "dual_tron1_mujoco.airbot_observer_validation:main"
airbot-observer-robustness = "dual_tron1_mujoco.airbot_observer_robustness:main"
payload-identification-validate = "dual_tron1_mujoco.payload_identification_validation:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
